<!DOCTYPE html>
<html>
<head>
  <title>Chat with Page Options</title>
  <link rel="stylesheet" type="text/css" href="options.css">
</head>
<body>
  <div class="container">
    <h1>Extension Options</h1>
    
    <div class="setting-item">
      <h2>Chat Font Size</h2>
      <p>Adjust the font size for the chat messages in the popup.</p>
      <div class="font-controls">
        <button id="decreaseFont">-</button>
        <span id="currentFontSizePreview">Normal</span> <!-- To show current size -->
        <button id="increaseFont">+</button>
      </div>
    </div>

    <!-- Add more settings here in the future -->

  </div>
  <script src="options.js"></script>
</body>
</html>
