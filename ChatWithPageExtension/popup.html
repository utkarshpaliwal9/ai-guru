<!DOCTYPE html>
<html>
<head>
  <title>Chat with Page</title>
  <link rel="stylesheet" type="text/css" href="popup.css">
</head>
<body>
  <div id="chatbox">
    <div class="tab-container">
      <div class="tabs-header">
        <div class="tabs-list" id="tabsList">
          <div class="tab active" data-tab-id="1">
            <span class="tab-title">Chat 1</span>
            <button class="tab-close" title="Close tab">×</button>
          </div>
        </div>
        <button class="new-tab-btn" id="newTabBtn" title="New conversation">+</button>
      </div>
    </div>
    <div class="controls">
      <label class="agent-toggle">
        <input type="checkbox" id="agentMode" />
        <span class="toggle-text">Agent mode</span>
        <span class="toggle-description">(Can modify webpage)</span>
      </label>
    </div>
    <div id="messages"></div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Ask a question...">
      <button id="sendButton">Send</button>
    </div>
    <div id="resizeGrip" class="resize-grip" title="Drag to resize"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
